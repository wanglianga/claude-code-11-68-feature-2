spring:
  application:
    name: clinical-fact-recon
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ccdev}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  recon-rule-version: recon-v1.0
  compliance:
    rule-version: compliance-v1.0
    as-of: ${COMPLIANCE_AS_OF:}        # 判定基准日(默认当天); 演示/测试可固定, 如 2026-06-01
    max-link-distance-days: 45         # 事件关联访视实例的最大锚点距离
